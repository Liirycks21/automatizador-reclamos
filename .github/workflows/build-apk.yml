name: Generar APK Automatizador
on: [push]

jobs:
  compilar:
    runs-on: ubuntu-20.04
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Instalar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          sudo apt update -y
          sudo apt install -y openjdk-11-jdk build-essential git libssl-dev zlib1g-dev
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Compilar APK
        run: buildozer android debug --allow-root --verbose

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK_Automatizador_Reclamos
          path: bin/*.apk
